# Builds Clink.exe and publishes a GitHub release when a v*.*.* tag is pushed
# (tools/release.ps1 does that); the tag must match <Version> in Clink/Clink.csproj.
# Run it by hand from the Actions tab (default branch only) to release whatever
# <Version> Clink/Clink.csproj currently says; it refuses if that version is
# already tagged, so an existing release is never overwritten.
#
# Two jobs (contract v2, see docs/RELEASING.md):
#   build   - no secrets, no environment, contents: read. Builds, packages and uploads the package as an artifact.
#   publish - environment feed-stable (required reviewer, deployment rule: stable tags / main). Guards (ref pattern, commit on
#             main, release not yet there), re-checks the artifact, signs the manifest when Clink/Assets/feed.json enables the
#             feed, creates a DRAFT release, uploads to the bucket, then publishes the draft.
#
# The in-app updater downloads the asset named exactly "Clink.exe" and checks it
# against the first 64-hex token of "Clink.exe.sha256", so keep those names.
#
# Every action is pinned to a commit SHA (the version is in the comment): the
# publish job holds contents:write and whatever code those actions run controls the
# update channel. Dependabot (.github/dependabot.yml) proposes bumps.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-dev.*'   # dev builds are published by release-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      exe_sha256: ${{ steps.package.outputs.exe_sha256 }}
      setup_sha256: ${{ steps.package.outputs.setup_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $match = Select-String -Path Clink/Clink.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'No <Version> element in Clink/Clink.csproj' }
          $csprojVersion = $match.Matches[0].Groups[1].Value.Trim()
          # Only final-release tags (vX.Y.Z) or a manual run on the default branch may ship.
          if ($env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$' -and $env:GITHUB_REF -ne "refs/heads/$(if ($env:DEFAULT_BRANCH) { $env:DEFAULT_BRANCH } else { 'main' })") {
            throw "Releases run only for tags vX.Y.Z or a manual run on the default branch (this run is on $env:GITHUB_REF)."
          }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            # tools/release.ps1 commits the <Version> bump before tagging, so a mismatch means a hand-made tag, most likely on
            # the wrong commit. Every running Clink would install that build automatically: refuse it.
            if ($version -ne $csprojVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match <Version>$csprojVersion</Version> in Clink/Clink.csproj. Release with tools/release.ps1, or delete the tag and tag the release commit."
            }
          } else {
            # A manual run releases the branch it was started from: only the default branch may ship to every user.
            $defaultBranch = if ($env:DEFAULT_BRANCH) { $env:DEFAULT_BRANCH } else { 'main' }
            if ($env:GITHUB_REF -ne "refs/heads/$defaultBranch") {
              throw "Manual releases run from $defaultBranch only (this run is on $env:GITHUB_REF)."
            }
            $version = $csprojVersion
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' is not a valid version (expected X.Y.Z)" }
          # Never overwrite or add to a release that already exists (tag and manual runs alike). The publish job checks again.
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'            # gh's stderr must not abort the step before we look at it
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = (& gh release view "v$version" --repo $env:GITHUB_REPOSITORY 2>&1 | Out-String)
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $eap
          if ($exists) { throw "A GitHub release v$version already exists; bump <Version> in Clink/Clink.csproj first." }
          if ($probe -notmatch 'release not found|HTTP 404') { throw "Could not check whether release v$version exists: $probe" }
          $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$prerelease"
          Write-Output "Building Clink $version (prerelease: $prerelease)"

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          dotnet publish Clink/Clink.csproj -c Release -o dist "-p:Version=$env:VERSION" "-p:UpdateRepo=$env:UPDATE_REPO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/Clink.exe)) { throw 'dist/Clink.exe was not produced' }
          Get-ChildItem dist | Select-Object Name, Length

      # What the BUILT exe embeds from Clink/Assets/feed.json must match what CI reads from the same file (off for an empty
      # file, on for a complete one; a partly filled file already fails in Get-FeedConfig). Clink.exe is a GUI-subsystem exe:
      # Start-Process -Wait -PassThru -NoNewWindow gives its output and exit code.
      - name: Check the embedded feed trust
        shell: pwsh
        timeout-minutes: 5
        run: |
          . ./tools/feed-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          $env:CLINK_EXPECT_FEED = $cfg.Mode
          $env:CLINK_TESTS_NO_SKIP = '1'
          $exe = (Resolve-Path dist/Clink.exe).Path
          Write-Output "Expecting the built exe to embed the feed as: $($cfg.Mode)"
          $run = Start-Process -FilePath $exe -ArgumentList '--unittest', 'Embedded_feed_trust_matches_ci_expectation' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Embedded_feed_trust_matches_ci_expectation failed (exit code $($run.ExitCode)): the built exe does not embed feed.json as CI expects ($($cfg.Mode))" }

      # Pinned Inno Setup 6.7.3 (>= 6.3 is needed for x64compatible). Official release asset of github.com/jrsoftware/issrc;
      # the SHA-256 below was computed from a scratch download and matches the digest GitHub shows for the asset.
      # Installed into the runner temp folder; nothing from it is trusted before the hash matches.
      - name: Install Inno Setup (pinned, hash-verified)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup installer hash mismatch: got $actual, expected $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $run = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Inno Setup install failed (exit code $($run.ExitCode))" }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'ISCC.exe not found after the Inno Setup install' }

      - name: Package (Clink.exe, sha256, installer)
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./tools/package.ps1 -ExePath dist/Clink.exe -Version $env:VERSION -OutDir dist/package -IsccPath (Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe') -RequireInstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-Content -Raw dist/package/package.json | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe_sha256=$($pkg.files.exe.sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "setup_sha256=$($pkg.files.installer.sha256)"
          Get-Content dist/package/Clink.exe.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clink-package
          path: dist/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    environment: feed-stable
    # One publisher at a time, never cancelled half way (a cancelled run could leave a draft release or a half-written bucket).
    concurrency:
      group: feed-stable-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Guards run before any secret is referenced by a step. Environment secrets are only readable by steps that name them.
      - name: Check out (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard - stable tag or main, commit on main, release not yet there
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $default = if ($env:DEFAULT_BRANCH) { $env:DEFAULT_BRANCH } else { 'main' }
          if ($env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+$' -and $env:GITHUB_REF -ne "refs/heads/$default") {
            throw "Stable releases publish only from tags vX.Y.Z or a manual run on $default (this run is on $env:GITHUB_REF)."
          }
          # The commit being released must be reachable from main (a tag pushed on a side branch must not ship).
          git merge-base --is-ancestor $env:GITHUB_SHA "origin/$default"
          if ($LASTEXITCODE -ne 0) { throw "Commit $env:GITHUB_SHA is not on origin/$default; refusing to publish." }
          $expected = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:VERSION }
          if ($expected -ne $env:VERSION) { throw "Version $env:VERSION from the build job does not match the ref ($expected)." }
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = (& gh release view "v$env:VERSION" 2>&1 | Out-String)
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $eap
          if ($exists) { throw "A GitHub release v$env:VERSION already exists (published or draft); refusing to touch it." }
          if ($probe -notmatch 'release not found|HTTP 404') { throw "Could not check whether release v$env:VERSION exists: $probe" }

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clink-package
          path: dist/package

      - name: Verify the package matches the build job
        shell: pwsh
        env:
          EXE_SHA256: ${{ needs.build.outputs.exe_sha256 }}
          SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
        run: |
          $exe = (Get-FileHash dist/package/Clink.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exe -ne $env:EXE_SHA256) { throw "Clink.exe in the artifact ($exe) is not what the build job produced ($env:EXE_SHA256)" }
          $setup = (Get-FileHash "dist/package/Clink-$env:VERSION-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setup -ne $env:SETUP_SHA256) { throw "The setup exe in the artifact ($setup) is not what the build job produced ($env:SETUP_SHA256)" }
          $line = (Get-Content -Raw dist/package/Clink.exe.sha256).Trim()
          if ($line -ne "$exe *Clink.exe") { throw "Clink.exe.sha256 does not describe Clink.exe: $line" }
          Write-Output "Package verified (Clink.exe $exe)"

      # Trust anchors come from the committed Clink/Assets/feed.json (the same file that was embedded in Clink.exe).
      - name: Read feed configuration
        id: feed
        shell: pwsh
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          . ./tools/feed-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          $enabled = $cfg.Enabled
          if (-not $enabled) { Write-Output "::warning::Stable update feed is not enabled in Clink/Assets/feed.json ($($cfg.Reason)); publishing the GitHub release without manifest assets." }
          elseif ($env:PRERELEASE -eq 'true') { Write-Output '::warning::Pre-release version: no stable manifest is published.'; $enabled = $false }
          Add-Content -Path $env:GITHUB_OUTPUT -Value ('enabled=' + $enabled.ToString().ToLowerInvariant())
          Add-Content -Path $env:GITHUB_OUTPUT -Value "feed_url=$($cfg.FeedUrl)"

      # Fail before anything is published if the bucket credentials are missing. Presence check only; nothing is printed.
      - name: Check bucket secrets
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $missing = 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_ENDPOINT', 'R2_BUCKET' |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) { throw "The stable feed is enabled in feed.json but these secrets are missing from the feed-stable environment: $($missing -join ', ')" }

      # The signing key exists only in this step's environment.
      - name: Make and sign the manifest
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          CLINK_FEED_SIGNING_KEY: ${{ secrets.CLINK_FEED_SIGNING_KEY }}
          FEED_URL: ${{ steps.feed.outputs.feed_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLINK_FEED_SIGNING_KEY)) { throw 'The stable feed is enabled in feed.json but CLINK_FEED_SIGNING_KEY is missing from the feed-stable environment.' }
          $tag = "v$env:VERSION"
          ./tools/make-manifest.ps1 -Channel stable -Version $env:VERSION -Tag $tag -BaseUrl "$($env:FEED_URL)releases/$tag/" `
            -NotesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" -PackageDir dist/package -FeedJson Clink/Assets/feed.json
          Get-ChildItem dist/package | Select-Object Name, Length

      - name: List release assets
        id: assets
        shell: pwsh
        run: |
          $files = @('dist/package/Clink.exe', 'dist/package/Clink.exe.sha256', "dist/package/Clink-$env:VERSION-setup.exe")
          if (Test-Path dist/package/stable.json) { $files += 'dist/package/stable.json', 'dist/package/stable.json.sig' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF`n$($files -join "`n")`nEOF"

      # A DRAFT first: nothing is visible to users (or to the updater's GitHub fallback) until the bucket upload succeeded.
      - name: Create GitHub release (draft)
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Clink v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}

      - name: Publish to the update feed
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLINK_FEED_KEY_PREFIX: ${{ vars.CLINK_FEED_KEY_PREFIX }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: ./tools/upload-feed.ps1 -Channel stable -Version $env:VERSION -PackageDir dist/package -FeedJson Clink/Assets/feed.json

      # Only now does the release become visible. With GitHub immutable releases enabled this also locks the assets and tag.
      - name: Publish the GitHub release
        shell: pwsh
        run: |
          gh release edit "v$env:VERSION" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the draft release' }
