# Compiles Clink and runs its unit tests (Clink.exe --unittest) on every push to
# main and on pull requests. Releases are built separately by release.yml.
# Actions are pinned to commit SHAs (version in the comment); Dependabot
# (.github/dependabot.yml) proposes bumps.
name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build
        shell: pwsh
        run: dotnet build Clink/Clink.csproj -c Release

      # The Windows build and the Media Foundation files of this runner image, for the log: windows-latest is
      # Windows Server 2025, whose Media Foundation applies the audio edit lists of an MP4 where Windows 11's
      # ignores them (Clink reads its clips with them hidden, see Engine/ClipSource.cs), so when a test here
      # behaves differently from one on a PC, this says what the image was.
      - name: Windows and Media Foundation versions
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "OS: $([Environment]::OSVersion.VersionString); $($cv.ProductName) $($cv.DisplayVersion), build $($cv.CurrentBuild).$($cv.UBR)"
          foreach ($dll in 'mfplat.dll', 'mfmp4srcsnk.dll', 'msauddecmft.dll') {
            $file = Join-Path $env:windir "System32\$dll"
            if (Test-Path $file) { "$dll $((Get-Item $file).VersionInfo.FileVersionRaw)" } else { "$dll not found" }
          }

      # Clink.exe is a GUI-subsystem exe: Start-Process -Wait -PassThru -NoNewWindow
      # is what shows its output and gives its exit code. CLINK_TESTS_NO_SKIP=1 makes a
      # skipped test a failure: the audio tests skip when Media Foundation or its AAC
      # encoder is missing, and this image has both, so a skip here would mean that an
      # image change had switched the audio tests off while the job stayed green.
      - name: Unit tests
        shell: pwsh
        timeout-minutes: 10
        env:
          CLINK_TESTS_NO_SKIP: '1'
        run: |
          $exe = Get-ChildItem -Path Clink/bin/Release -Filter Clink.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Clink.exe was not found under Clink/bin/Release' }
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--unittest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Unit tests failed (exit code $($run.ExitCode))" }

  # Packaging dry run: both flavours are published, checked and packaged exactly like the release workflows do, minus the
  # installer (no Inno Setup) and everything that publishes. No environment, no secrets, contents: read only.
  package-dry-run:
    name: Package dry run
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish both flavours
        shell: pwsh
        run: |
          $match = Select-String -Path Clink/Clink.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'No <Version> element in Clink/Clink.csproj' }
          $version = $match.Matches[0].Groups[1].Value.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Clink.csproj Version '$version' is not X.Y.Z" }
          Add-Content -Path $env:GITHUB_ENV -Value "CLINK_DRY_RUN_VERSION=$version"
          ./tools/publish-flavours.ps1 -Version $version
          Get-ChildItem dist/sc, dist/fx | Select-Object FullName, Length

      - name: Script tests (PowerShell 7)
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -NoProfile -File ./tools/tests/run-script-tests.ps1

      - name: Check the published exes
        shell: pwsh
        timeout-minutes: 10
        run: |
          . ./tools/feed-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          ./tools/check-published.ps1 -ScExe dist/sc/Clink.exe -FxExe dist/fx/Clink.exe -Version $env:CLINK_DRY_RUN_VERSION -ExpectFeed $cfg.Mode

      - name: Package (no installer)
        shell: pwsh
        run: |
          ./tools/package.ps1 -ExePath dist/sc/Clink.exe -FrameworkExePath dist/fx/Clink.exe -Version $env:CLINK_DRY_RUN_VERSION -OutDir dist/package -SkipInstaller
          Get-ChildItem dist/package | Select-Object Name, Length
          Get-Content dist/package/package.json