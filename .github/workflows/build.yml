# Compiles Clink and runs its unit tests (Clink.exe --unittest) on every push to
# main and on pull requests. Releases are built separately by release.yml.
# Actions are pinned to commit SHAs (version in the comment); Dependabot
# (.github/dependabot.yml) proposes bumps.
name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # setup-dotnet downloads the SDK: the dotnet.exe this job resolves must be Authenticode-valid with an exact Microsoft signer subject
      # and report the version global.json pins (tools/lib/dotnet-sdk-lib.ps1).
      - name: Verify the .NET SDK (Authenticode, pinned version)
        shell: pwsh
        run: |
          . ./tools/lib/dotnet-sdk-lib.ps1
          Assert-DotNetSdk -GlobalJsonPath global.json

      # The key covers nuget.config and there is NO fallback key list (no partial match): a change of the package pins, the source or the trusted signers starts from an
      # empty folder instead of a stale one (a cache hit skips the signature checks, so the cache must never outlive the rules it was built
      # under). The release workflows do not use a cache at all.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'nuget.config') }}

      - name: Build
        shell: pwsh
        run: dotnet build Clink/Clink.csproj -c Release

      # The Windows build and the Media Foundation files of this runner image, for the log: windows-latest is
      # Windows Server 2025, whose Media Foundation applies the audio edit lists of an MP4 where Windows 11's
      # ignores them (Clink reads its clips with them hidden, see Engine/ClipSource.cs), so when a test here
      # behaves differently from one on a PC, this says what the image was.
      - name: Windows and Media Foundation versions
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "OS: $([Environment]::OSVersion.VersionString); $($cv.ProductName) $($cv.DisplayVersion), build $($cv.CurrentBuild).$($cv.UBR)"
          foreach ($dll in 'mfplat.dll', 'mfmp4srcsnk.dll', 'msauddecmft.dll', 'mfh264enc.dll', 'msmpeg2vdec.dll') {
            $file = Join-Path $env:windir "System32\$dll"
            if (Test-Path $file) { "$dll $((Get-Item $file).VersionInfo.FileVersionRaw)" } else { "$dll not found" }
          }

      # Clink.exe is a GUI-subsystem exe: Start-Process -Wait -PassThru -NoNewWindow
      # is what shows its output and gives its exit code. CLINK_TESTS_NO_SKIP=1 makes a
      # skipped test a failure: the audio tests skip when Media Foundation or its AAC
      # encoder is missing, and this image has both, so a skip here would mean that an
      # image change had switched the audio tests off while the job stayed green.
      - name: Unit tests
        shell: pwsh
        timeout-minutes: 10
        env:
          CLINK_TESTS_NO_SKIP: '1'
        run: |
          $exe = Get-ChildItem -Path Clink/bin/Release -Filter Clink.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Clink.exe was not found under Clink/bin/Release' }
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--unittest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Unit tests failed (exit code $($run.ExitCode))" }

  # Packaging dry run: both flavours are published, checked and packaged exactly like the release workflows do, including the
  # real installer compile (pinned Inno Setup, dry-run runtime inputs), minus everything that publishes. No environment, no secrets, contents: read only.
  # Nothing in this file may name a secret (a test enforces it); any artifact it uploaded would be kept 1 day (retention-days: 1).
  package-dry-run:
    name: Package dry run
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # setup-dotnet downloads the SDK: the dotnet.exe this job resolves must be Authenticode-valid with an exact Microsoft signer subject
      # and report the version global.json pins (tools/lib/dotnet-sdk-lib.ps1).
      - name: Verify the .NET SDK (Authenticode, pinned version)
        shell: pwsh
        run: |
          . ./tools/lib/dotnet-sdk-lib.ps1
          Assert-DotNetSdk -GlobalJsonPath global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'nuget.config') }}

      - name: Publish both flavours
        shell: pwsh
        run: |
          $match = Select-String -Path Clink/Clink.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'No <Version> element in Clink/Clink.csproj' }
          $version = $match.Matches[0].Groups[1].Value.Trim()
          if ($version -cnotmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z') { throw "Clink.csproj Version '$version' is not X.Y.Z" }
          Add-Content -Path $env:GITHUB_ENV -Value "CLINK_DRY_RUN_VERSION=$version"
          ./tools/publish-flavours.ps1 -Version $version
          Get-ChildItem dist/sc, dist/fx | Select-Object FullName, Length

      # What NuGet itself recorded for the two restores: nuget.org is the only source, no fallback folder, the package folder is the default
      # one, the repo nuget.config was read, and every package's .nupkg.metadata names nuget.org (tools/lib/nuget-restore-lib.ps1).
      - name: Verify the NuGet restore (nuget.org only)
        shell: pwsh
        run: |
          . ./tools/lib/nuget-restore-lib.ps1
          Assert-NuGetRestoreTrusted -AssetsFile Clink/obj_sc/project.assets.json, Clink/obj_fx/project.assets.json

      # Same notices gate as the release workflows. The runtime freshness check is NOT run here: it needs the latest runtime version,
      # which only tools/resolve-dotnet-runtime.ps1 fetches (a network call plus a 60 MB download), and this job does not run the
      # resolver (the installer here uses the committed floor, not the latest runtime). The release workflows run it.
      - name: Check the third-party notices
        shell: pwsh
        run: |
          ./tools/notices/make-notices.ps1 -Check -AssetsFile Clink/obj_sc/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'THIRD-PARTY-NOTICES.txt is out of date (see the output above).' }

      # I-3. The client-source guard always runs STRICT (CLINK_GUARD_STRICT=1): the legacy update path is gone, and a plain env entry
      # means re-adding it cannot make the guard lenient again (private-ci.tests.ps1 accepts only this form).
      - name: Script tests (PowerShell 7)
        shell: pwsh
        timeout-minutes: 10
        env:
          CLINK_GUARD_STRICT: '1'
        run: |
          pwsh -NoProfile -File ./tools/tests/run-script-tests.ps1

      - name: Check the published exes
        shell: pwsh
        timeout-minutes: 20
        run: |
          . ./tools/feed-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          $devCfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel dev
          # The two bases (normalised) are what the exe's self-test compares with the bases it resolved; with the feed off both are empty and are not passed.
          if ($cfg.Mode -eq 'on') {
            ./tools/check-published.ps1 -ScExe dist/sc/Clink.exe -FxExe dist/fx/Clink.exe -Version $env:CLINK_DRY_RUN_VERSION -ExpectFeed $cfg.Mode -ExpectFeedUrl $cfg.FeedUrl -ExpectDevFeedUrl $devCfg.FeedUrl -TimeoutSeconds 90
          } else {
            ./tools/check-published.ps1 -ScExe dist/sc/Clink.exe -FxExe dist/fx/Clink.exe -Version $env:CLINK_DRY_RUN_VERSION -ExpectFeed $cfg.Mode -TimeoutSeconds 90
          }

      # Same pinned, hash-verified Inno Setup as release.yml (6.7.3, >= 6.3 is needed for x64compatible): the dry run compiles the REAL
      # installer script so a broken installer\Clink.iss fails a pull request, not a release. The setup exe is not uploaded anywhere.
      - name: Install Inno Setup (pinned, hash-verified)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup installer hash mismatch: got $actual, expected $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $run = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Inno Setup install failed (exit code $($run.ExitCode))" }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'ISCC.exe not found after the Inno Setup install' }

      # The runtime task inputs for the dry-run installer need no network: the version is the committed floor of
      # tools/lib/dotnet-runtime-lib.ps1, the URL is the one built for it, and the SHA-256 is a DRY-RUN DUMMY (64 zeros), good enough
      # to compile the script; this setup exe is never run or published.
      - name: Dry-run runtime inputs (committed floor)
        id: floor
        shell: pwsh
        run: |
          . ./tools/lib/dotnet-runtime-lib.ps1
          $version = $script:MinimumRuntimeVersion
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "url=$(Get-ExpectedDotNetRuntimeUrl -Version $version)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$('0' * 64)"

      - name: Package (installer compiled, not uploaded)
        shell: pwsh
        env:
          DRY_RUN_RUNTIME_VERSION: ${{ steps.floor.outputs.version }}
          DRY_RUN_RUNTIME_URL: ${{ steps.floor.outputs.url }}
          DRY_RUN_RUNTIME_SHA256: ${{ steps.floor.outputs.sha256 }}
        run: |
          ./tools/package.ps1 -ExePath dist/sc/Clink.exe -FrameworkExePath dist/fx/Clink.exe -Version $env:CLINK_DRY_RUN_VERSION -OutDir dist/package -IsccPath (Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe') -DotNetRuntimeVersion $env:DRY_RUN_RUNTIME_VERSION -DotNetRuntimeUrl $env:DRY_RUN_RUNTIME_URL -DotNetRuntimeSha256 $env:DRY_RUN_RUNTIME_SHA256 -RequireInstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist/package | Select-Object Name, Length
          Get-Content dist/package/package.json
