# Publishes a dev build of Clink to the dev feed bucket (when feed.json enables the feed) and records it as a private GitHub PRERELEASE
# (the archive, the audit trail and the history floor) whenever the dev branch is
# pushed (or run by hand from the Actions tab, dev branch only). Clink installs it
# only when "Dev Build" is ticked in its version popup (click the version in the
# footer); the stable channel never sees a dev build. The app never contacts GitHub.
#
# Version: X.Y.Z-dev.N. X.Y.Z is <Version> in Clink/Clink.csproj when that is
# ahead of the latest release (a bumped csproj gives a true prerelease of the
# planned version), otherwise the latest release with the patch raised by one.
# Either way it sorts above the shipped release and below that release's own
# final build. N grows with every dev build (run number, or above the highest
# existing dev tag); the app compares N numerically.
#
# Three jobs (contract v2, see docs/RELEASING.md):
#   build   - no secrets, no environment, contents: read. Builds, runs the unit tests (a dev build never ships with failing
#             tests), packages and uploads the package as an artifact (kept 1 day).
#   publish - NO environment (the plan has none on a private repo), contents: write only; the signing key, the R2 credentials and the
#             purge token are REPO secrets, named only by the steps that need them; the job runs only for a push to refs/heads/dev (or a dispatch on it).
#             Guards, re-checks the artifact, REFUSES to publish when Clink/Assets/feed.json does not enable the feed (the feed is ON
#             in the committed file, so a red publish job here means it was switched off; the build job still runs), writes notes.txt, signs the dev
#             manifest, creates a DRAFT prerelease, verifies it by ID, uploads to the bucket,
#             verifies the draft AGAIN right before publishing it, publishes it, verifies the published release and tag (a failed
#             second or third check deletes the release: docs/RELEASING.md, "Integrity incident"), prunes.
#   cleanup - actions: write and nothing else, no checkout, no action, no secret: deletes this run's own build artifact (always, after publish).
# Only the 10 newest dev builds are kept (GitHub prereleases and bucket folders).
#
# Same rules as release.yml: the assets are named exactly "Clink.exe" and "Clink-framework.exe", each with a
# ".sha256" beside it, and every action is pinned to a commit SHA.
name: Release (dev build)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exe_sha256: ${{ steps.package.outputs.exe_sha256 }}
      fx_sha256: ${{ steps.package.outputs.fx_sha256 }}
      pkg_sha256: ${{ steps.package.outputs.pkg_sha256 }}
      setup_sha256: ${{ steps.package.outputs.setup_sha256 }}
      notices_sha256: ${{ steps.package.outputs.notices_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      min_stable: ${{ steps.seeds.outputs.min_stable }}
      min_dev: ${{ steps.seeds.outputs.min_dev }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A fresh NuGet package folder and HTTP cache per run, under the runner temp folder: nothing a runner image or an earlier job left in
      # ~/.nuget/packages is ever used, so every package is downloaded and its signature checked by this restore. No actions/cache here.
      # The restore record is checked after the publish step below (tools/lib/nuget-restore-lib.ps1).
      - name: Fresh NuGet folders
        shell: pwsh
        run: |
          . ./tools/lib/nuget-restore-lib.ps1
          $folders = New-FreshNuGetFolders -TempRoot $env:RUNNER_TEMP -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          Add-Content -Path $env:GITHUB_ENV -Value "NUGET_PACKAGES=$($folders.Packages)"
          Add-Content -Path $env:GITHUB_ENV -Value "NUGET_HTTP_CACHE_PATH=$($folders.HttpCache)"
          Write-Output "NuGet packages: $($folders.Packages)"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # setup-dotnet downloads the SDK: the dotnet.exe this job resolves must be Authenticode-valid with an exact Microsoft signer subject
      # and report the version global.json pins (tools/lib/dotnet-sdk-lib.ps1).
      - name: Verify the .NET SDK (Authenticode, pinned version)
        shell: pwsh
        run: |
          . ./tools/lib/dotnet-sdk-lib.ps1
          Assert-DotNetSdk -GlobalJsonPath global.json

      - name: Only the dev branch publishes
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/dev') { throw "dev builds publish only from the dev branch (this run is on $env:GITHUB_REF)" }

      # M1. The embedded floor seeds: the newest PUBLISHED stable and the newest PUBLISHED dev release that carried a manifest (the same
      # Get-FeedHistoryFloor the publish job uses for its history floor), read with the job's read token (contents: read, GET only). They
      # become -p:ClinkMinStable / -p:ClinkMinDev for the unit-tested build below AND for both published flavours, so the binary that is
      # tested is the binary that ships. Each must be exactly X.Y.Z or X.Y.Z-dev.N (no ';' reaches MSBuild); empty = no seed. L-4: only
      # releases made by github-actions[bot] count (the author column). The seeds are also job outputs: the publish job refuses when its
      # dev history floor differs from the dev seed.
      - name: Find the embedded floor seeds
        id: seeds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          $listing = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | [.tag_name, (.draft | tostring), ([.assets[].name] | join(",")), (.author.login | tostring)] | @tsv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the earlier releases.' }
          $seeds = Get-FeedFloorSeeds -Listing $listing
          Write-Output "Embedded floor seeds: stable '$($seeds.Stable)', dev '$($seeds.Dev)'"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "min_stable=$($seeds.Stable)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "min_dev=$($seeds.Dev)"

      - name: Build
        shell: pwsh
        env:
          MIN_STABLE: ${{ steps.seeds.outputs.min_stable }}
          MIN_DEV: ${{ steps.seeds.outputs.min_dev }}
        run: |
          $props = @()
          if ($env:MIN_STABLE) { $props += "-p:ClinkMinStable=$env:MIN_STABLE" }
          if ($env:MIN_DEV) { $props += "-p:ClinkMinDev=$env:MIN_DEV" }
          dotnet build Clink/Clink.csproj -c Release @props

      # The Windows build and the Media Foundation files of this runner image, for the log (same step as build.yml): the unit tests
      # below encode and decode video, so when one behaves differently from a PC, this says what the image was.
      - name: Windows and Media Foundation versions
        shell: pwsh
        run: |
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "OS: $([Environment]::OSVersion.VersionString); $($cv.ProductName) $($cv.DisplayVersion), build $($cv.CurrentBuild).$($cv.UBR)"
          foreach ($dll in 'mfplat.dll', 'mfmp4srcsnk.dll', 'msauddecmft.dll', 'mfh264enc.dll', 'msmpeg2vdec.dll') {
            $file = Join-Path $env:windir "System32\$dll"
            if (Test-Path $file) { "$dll $((Get-Item $file).VersionInfo.FileVersionRaw)" } else { "$dll not found" }
          }

      # Clink.exe is a GUI-subsystem exe: Start-Process -Wait -PassThru -NoNewWindow
      # is what shows its output and gives its exit code (same as build.yml).
      - name: Unit tests
        shell: pwsh
        timeout-minutes: 10
        env:
          CLINK_TESTS_NO_SKIP: '1'
        run: |
          . ./tools/feed-lib.ps1
          # What CI reads from Clink/Assets/feed.json, for the embedded-feed self-test: the state, and the two resolved bases (normalised;
          # the dev base is devFeedUrl, or feedUrl when that is empty). The test compares them ordinally with the bases the built exe
          # resolves, and only when the variables are set (with the feed off both are empty, so the state alone is compared).
          $stableCfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          $devCfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel dev
          $env:CLINK_EXPECT_FEED = $devCfg.Mode
          $env:CLINK_EXPECT_FEED_URL = $stableCfg.FeedUrl
          $env:CLINK_EXPECT_DEV_FEED_URL = $devCfg.FeedUrl
          $exe = Get-ChildItem -Path Clink/bin/Release -Filter Clink.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Clink.exe was not found under Clink/bin/Release' }
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--unittest' -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) { throw "Unit tests failed (exit code $($run.ExitCode))" }

      - name: Determine version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path Clink/Clink.csproj -Pattern '<Version>([^<]+)</Version>' | Select-Object -First 1
          if (-not $match) { throw 'No <Version> element in Clink/Clink.csproj' }
          $csproj = [version]($match.Matches[0].Groups[1].Value.Trim() -replace '-.*$', '')

          # The latest (non-prerelease) release; a 404 means there is none yet.
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'            # gh's stderr must not abort the step before we look at it
          $PSNativeCommandUseErrorActionPreference = $false
          $out = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>&1 | Out-String)
          $code = $LASTEXITCODE
          $ErrorActionPreference = $eap
          if ($code -eq 0) {
            $latest = [version](($out.Trim() -replace '^v', '') -replace '-.*$', '')
            Write-Output "releases/latest answered with a release (200 path): $($out.Trim())"
          }
          elseif ($out -cmatch '\(HTTP 404\)') {
            $latest = [version]'0.0.0'
            Write-Output 'releases/latest answered HTTP 404 (404 path): the repository has no latest release yet'
          }
          else { throw "Could not read the latest release: $out" }

          if ($csproj -gt $latest) { $xyz = "$($csproj.Major).$($csproj.Minor).$($csproj.Build)" }
          else { $xyz = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)" }

          # N: the run number, but always above every dev N that is already taken: by a release (every page of the listing; this read token
          # sees published releases only, drafts are invisible to it) or by a git tag. The tag list matters because an immutable release
          # keeps its tag after the release itself is deleted (the prune step does that), so a pruned run's number must never come back.
          $tags = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the releases' }
          $refs = @(& gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/v?per_page=100" --paginate --jq '.[].ref')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the tags' }
          $maxN = [int64]0
          foreach ($tag in $tags) {
            if (([string]$tag) -cmatch '\Av[0-9]+\.[0-9]+\.[0-9]+-dev\.([0-9]+)\z') { $maxN = [Math]::Max($maxN, [int64]$Matches[1]) }
          }
          foreach ($ref in $refs) {
            if (([string]$ref) -cmatch '\Arefs/tags/v[0-9]+\.[0-9]+\.[0-9]+-dev\.([0-9]+)\z') { $maxN = [Math]::Max($maxN, [int64]$Matches[1]) }
          }
          $n = [Math]::Max([int64]$env:GITHUB_RUN_NUMBER, $maxN + 1)

          $version = "$xyz-dev.$n"
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$') { throw "'$version' is not a valid version (expected X.Y.Z-dev.N)" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Output "Building Clink $version (csproj $csproj, latest release $latest)"

      # The dev version is only known after the step above (it needs the release and tag listings), which runs after the seeds step, so the
      # check "the dev floor seed is strictly lower than the version" lives here, with the seed the seeds step found.
      - name: Check the dev floor seed is below the version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MIN_DEV: ${{ steps.seeds.outputs.min_dev }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          Assert-FeedSeedBelowVersion -Channel dev -Seed $env:MIN_DEV -Version $env:VERSION

      # Self-contained (dist/sc, the portable Clink.exe) and framework-dependent (dist/fx, the installer's exe), separate obj/bin.
      - name: Publish both flavours
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_REPO: ${{ github.repository }}
          MIN_STABLE: ${{ steps.seeds.outputs.min_stable }}
          MIN_DEV: ${{ steps.seeds.outputs.min_dev }}
        run: |
          ./tools/publish-flavours.ps1 -Version $env:VERSION -UpdateRepo $env:UPDATE_REPO -MinStable $env:MIN_STABLE -MinDev $env:MIN_DEV
          Get-ChildItem dist/sc, dist/fx | Select-Object FullName, Length

      # What NuGet itself recorded for the three restores (the plain build in obj, and obj_sc, obj_fx): nuget.org is the only source, no
      # fallback folder, the package folder is the fresh one, the repo nuget.config was read (a --configfile restore or a
      # RestoreFallbackFolders property would show here), and every package's .nupkg.metadata names nuget.org.
      - name: Verify the NuGet restore (nuget.org only, fresh package folder)
        shell: pwsh
        run: |
          . ./tools/lib/nuget-restore-lib.ps1
          Assert-NuGetRestoreTrusted -AssetsFile Clink/obj/project.assets.json, Clink/obj_sc/project.assets.json, Clink/obj_fx/project.assets.json

      # THIRD-PARTY-NOTICES.txt must match tools/notices/sources.json (hashes of every licence text) and the runtime packs / SDK
      # reference / CsWin32 this restore actually used. Fails when the file is stale or the assets file lacks the runtime packs.
      - name: Check the third-party notices
        shell: pwsh
        run: |
          ./tools/notices/make-notices.ps1 -Check -AssetsFile Clink/obj_sc/project.assets.json
          if ($LASTEXITCODE -ne 0) { throw 'THIRD-PARTY-NOTICES.txt is out of date (see the output above).' }

      # The latest .NET 10 Desktop Runtime installer for the setup exe: release metadata from builds.dotnet.microsoft.com, downloaded
      # into a scratch folder, SHA-512 and Authenticode (Microsoft signer) verified, SHA-256 computed, the file deleted and NEVER run.
      # The JSON it prints is kept for package.ps1 (-RuntimeInfoPath); it also writes version/url/sha256/sha512/size to GITHUB_OUTPUT.
      - name: Resolve the .NET runtime installer
        id: runtime
        shell: pwsh
        timeout-minutes: 15
        run: |
          $lines = @(& pwsh -NoProfile -File tools/resolve-dotnet-runtime.ps1)
          if ($LASTEXITCODE -ne 0) { throw 'resolve-dotnet-runtime.ps1 failed (see the output above).' }
          $jsonLines = @($lines | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ -match '^\{.*\}$' })
          if ($jsonLines.Count -eq 0) { throw "resolve-dotnet-runtime.ps1 printed no JSON line: $($lines -join ' | ')" }
          $json = $jsonLines[-1]
          $info = $json | ConvertFrom-Json
          if (-not $info.version -or -not $info.url -or -not $info.sha256) { throw "resolve-dotnet-runtime.ps1 printed no version/url/sha256: $json" }
          [System.IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'dotnet-runtime.json'), $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output "Runtime installer: $($info.version) $($info.sha256)"

      # Dev builds only WARN (::warning::) when the bundled runtime pack is older than the latest runtime; stable releases fail.
      - name: Check the bundled runtime is current
        shell: pwsh
        env:
          LATEST_RUNTIME: ${{ steps.runtime.outputs.version }}
        run: |
          ./tools/check-runtime-freshness.ps1 -AssetsFile Clink/obj_sc/project.assets.json -LatestVersion $env:LATEST_RUNTIME
          if ($LASTEXITCODE -ne 0) { throw 'The self-contained Clink.exe bundles an outdated .NET runtime (see the output above).' }

      # Both published exes: size guards, --packaging-check, --preflight, the embedded-feed self-test (what the BUILT exes embed from
      # Clink/Assets/feed.json must match what CI reads from the same file: off for an empty file, on for a complete one; a partly
      # filled file already fails in Get-FeedConfig) and ProductVersion == the version (the updater refuses a download whose embedded
      # version differs from its tag). The framework exe needs the WindowsDesktop 10 runtime of the runner image.
      - name: Check the published exes
        shell: pwsh
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          . ./tools/feed-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel dev
          $stableCfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel stable
          Write-Output "Expecting the built exes to embed the feed as: $($cfg.Mode)"
          # The two bases (normalised) are what the exe's self-test compares with the bases it resolved; with the feed off both are empty and are not passed.
          if ($cfg.Mode -eq 'on') {
            ./tools/check-published.ps1 -ScExe dist/sc/Clink.exe -FxExe dist/fx/Clink.exe -Version $env:VERSION -ExpectFeed $cfg.Mode -ExpectFeedUrl $stableCfg.FeedUrl -ExpectDevFeedUrl $cfg.FeedUrl -TimeoutSeconds 90
          } else {
            ./tools/check-published.ps1 -ScExe dist/sc/Clink.exe -FxExe dist/fx/Clink.exe -Version $env:VERSION -ExpectFeed $cfg.Mode -TimeoutSeconds 90
          }

      # Pinned Inno Setup 6.7.3 (>= 6.3 is needed for x64compatible). Official release asset of github.com/jrsoftware/issrc;
      # the SHA-256 below was computed from a scratch download and matches the digest GitHub shows for the asset.
      # Installed into the runner temp folder; nothing from it is trusted before the hash matches.
      - name: Install Inno Setup (pinned, hash-verified)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:INNO_SHA256) { throw "Inno Setup installer hash mismatch: got $actual, expected $env:INNO_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $run = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$dir" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Inno Setup install failed (exit code $($run.ExitCode))" }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'ISCC.exe not found after the Inno Setup install' }

      - name: Package (Clink.exe, Clink-framework.exe, sha256 files, installer)
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./tools/package.ps1 -ExePath dist/sc/Clink.exe -FrameworkExePath dist/fx/Clink.exe -Version $env:VERSION -OutDir dist/package -IsccPath (Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe') -RuntimeInfoPath (Join-Path $env:RUNNER_TEMP 'dotnet-runtime.json') -RequireInstaller
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = Get-Content -Raw dist/package/package.json | ConvertFrom-Json
          Add-Content -Path $env:GITHUB_OUTPUT -Value "exe_sha256=$($pkg.files.exe.sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "fx_sha256=$($pkg.files.exeFramework.sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "pkg_sha256=$((Get-FileHash dist/package/package.json -Algorithm SHA256).Hash.ToLowerInvariant())"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "setup_sha256=$($pkg.files.installer.sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notices_sha256=$($pkg.files.notices.sha256)"
          Get-Content dist/package/Clink.exe.sha256, dist/package/Clink-framework.exe.sha256

      - name: Upload package artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clink-package
          path: dist/package/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: windows-latest
    # No environment (not available on a private Free repo). First defence, evaluated before any step runs: the dev branch only, by push
    # or a hand-started run on it. The first step ("Guard - dev branch only ...") checks the ref again before any secret is referenced.
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # One publisher at a time, never cancelled half way.
    concurrency:
      group: feed-dev-publish
      cancel-in-progress: false
    # contents: write ONLY. No actions: permission here: the build artifact is deleted by the separate cleanup job below, whose token has
    # actions: write and nothing else, so no step or tool of this job can delete run logs, dispatch workflows or disable them.
    permissions:
      contents: write
    # The write token is not put in the job-wide environment: only the steps that call gh name GH_TOKEN, so the aws, make-manifest and
    # upload-feed steps do not get it in THEIR environment. That is hygiene, NOT isolation: the job's token exists for the whole job and
    # any code that runs in the job (an action, a script) can obtain it. Real isolation needs a job split (a draft job, a feed job with
    # the secrets, a publish job); docs/RELEASING.md lists it as a follow-up. The defence that exists today is the verification
    # by release ID before and after publishing. The same goes for the repo secrets (docs/RELEASING.md, "Who can reach the secrets").
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Guards run before any secret is referenced by a step.
      - name: Guard - dev branch only, release not yet there
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -cne 'push' -and $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch') { throw "dev builds publish only for a push or a hand-started run on the dev branch (this run is a $env:GITHUB_EVENT_NAME event)" }
          if ($env:GITHUB_REF -ne 'refs/heads/dev') { throw "dev builds publish only from the dev branch (this run is on $env:GITHUB_REF)" }
          if ($env:VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$') { throw "'$env:VERSION' is not an X.Y.Z-dev.N version" }
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = (& gh release view "v$env:VERSION" 2>&1 | Out-String)
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0                       # the runner appends an exit-code check; "not found" is handled below
          $ErrorActionPreference = $eap
          if ($exists) { throw "A GitHub release v$env:VERSION already exists (published or draft). A draft is what a failed earlier run leaves behind: check it, delete it (docs/RELEASING.md, 'Stale drafts') and re-run." }
          if ($probe -notmatch 'release not found|HTTP 404') { throw "Could not check whether release v$env:VERSION exists: $probe" }

      # L2: the release must be tied to the commit that was built. A tag that already exists would make the release point at some
      # other commit (or let a stale draft's tag be reused), so the tag ref must not exist yet; only HTTP 404 means "not there".
      - name: Guard - the tag does not exist yet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $eap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $refOut = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$env:VERSION" 2>&1 | Out-String)
          $refCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0                       # the runner appends an exit-code check; a 404 is handled below
          $ErrorActionPreference = $eap
          if ($refCode -eq 0) { throw "The tag v$env:VERSION already exists; a dev build creates its own tag at the built commit. Refusing to publish." }
          if ($refOut -cnotmatch '\(HTTP 404\)') { throw "Could not check whether the tag v$env:VERSION exists (exit $refCode): $refOut" }
          Write-Output "The tag v$env:VERSION does not exist yet (HTTP 404), as expected"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clink-package
          path: dist/package

      - name: Verify the package matches the build job
        shell: pwsh
        env:
          EXE_SHA256: ${{ needs.build.outputs.exe_sha256 }}
          FX_SHA256: ${{ needs.build.outputs.fx_sha256 }}
          PKG_SHA256: ${{ needs.build.outputs.pkg_sha256 }}
          SETUP_SHA256: ${{ needs.build.outputs.setup_sha256 }}
          NOTICES_SHA256: ${{ needs.build.outputs.notices_sha256 }}
        run: |
          # package.json drives the manifest script (file names, hashes, minRuntime): it must be the one the build job wrote.
          $pkgHash = (Get-FileHash dist/package/package.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pkgHash -ne $env:PKG_SHA256) { throw "package.json in the artifact ($pkgHash) is not what the build job produced ($env:PKG_SHA256)" }
          $exe = (Get-FileHash dist/package/Clink.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exe -ne $env:EXE_SHA256) { throw "Clink.exe in the artifact ($exe) is not what the build job produced ($env:EXE_SHA256)" }
          $fx = (Get-FileHash dist/package/Clink-framework.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fx -ne $env:FX_SHA256) { throw "Clink-framework.exe in the artifact ($fx) is not what the build job produced ($env:FX_SHA256)" }
          $setup = (Get-FileHash "dist/package/Clink-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setup -ne $env:SETUP_SHA256) { throw "The setup exe in the artifact ($setup) is not what the build job produced ($env:SETUP_SHA256)" }
          $notices = (Get-FileHash dist/package/THIRD-PARTY-NOTICES.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($notices -ne $env:NOTICES_SHA256) { throw "THIRD-PARTY-NOTICES.txt in the artifact ($notices) is not what the build job produced ($env:NOTICES_SHA256)" }
          $line = (Get-Content -Raw dist/package/Clink.exe.sha256).Trim()
          if ($line -ne "$exe *Clink.exe") { throw "Clink.exe.sha256 does not describe Clink.exe: $line" }
          $fxLine = (Get-Content -Raw dist/package/Clink-framework.exe.sha256).Trim()
          if ($fxLine -ne "$fx *Clink-framework.exe") { throw "Clink-framework.exe.sha256 does not describe Clink-framework.exe: $fxLine" }
          $setupLine = (Get-Content -Raw dist/package/Clink-Setup.exe.sha256).Trim()
          if ($setupLine -ne "$setup *Clink-Setup.exe") { throw "Clink-Setup.exe.sha256 does not describe Clink-Setup.exe: $setupLine" }
          Write-Output "Package verified (Clink.exe $exe, Clink-framework.exe $fx)"

      # Trust anchors come from the committed Clink/Assets/feed.json (the same file that was embedded in Clink.exe). feed_url is the DEV
      # channel's base: devFeedUrl, or feedUrl when devFeedUrl is empty (Get-FeedConfig -Channel dev).
      - name: Read feed configuration
        id: feed
        shell: pwsh
        env:
          CLINK_FEED_KEY_PREFIX: ${{ vars.CLINK_FEED_KEY_PREFIX }}
          CLINK_IMMUTABLE_RELEASES: ${{ vars.CLINK_IMMUTABLE_RELEASES }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          . ./tools/lib/release-mode-lib.ps1
          $cfg = Get-FeedConfig -Path Clink/Assets/feed.json -Channel dev
          # H1. A feed-less dev publish is REFUSED: nothing is signed, no draft exists, no secret was read. The build job still ran (it builds
          # and runs the unit tests), only publishing is red if the feed is ever switched off again (docs/RELEASING.md, "The feed-on change").
          if (-not $cfg.Enabled) { throw "The dev update feed is not enabled in Clink/Assets/feed.json ($($cfg.Reason)); refusing to publish (a GitHub prerelease without the feed would reach nobody). Land the feed-on commit first (docs/RELEASING.md, 'The feed-on change')." }
          # L-2. A mistyped CLINK_IMMUTABLE_RELEASES fails HERE, before the draft exists (the three release checks validate it again).
          [void](Get-ImmutableReleasesMode -Value $env:CLINK_IMMUTABLE_RELEASES)
          # The base path must be exactly /<prefix>/ (upload-feed.ps1 checks it again). Failing HERE means nothing was signed and no draft exists yet.
          Assert-FeedBaseMatchesPrefix -BaseUrl $cfg.FeedUrl -Prefix (Get-FeedKeyPrefix -Value $env:CLINK_FEED_KEY_PREFIX)
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'enabled=true'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "feed_url=$($cfg.FeedUrl)"

      # Defence in depth: "Read feed configuration" above already refuses a feed-less publish, so this step is skipped while the feed is on (the normal case). It stays so that
      # the rule "a feed that was on stays on" (docs/RELEASING.md) is still enforced if that refusal is ever relaxed: refuse a feed-less
      # publish when any earlier release (drafts included) of this repository carried dev.json. Read-only API calls with the job token.
      - name: Guard - a feed that was on stays on
        if: steps.feed.outputs.enabled != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          $names = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the assets of the earlier releases.' }
          Assert-FeedNeverWasOn -Channel dev -AssetNames $names

      # Fail before anything is published if the bucket credentials are missing. Presence check only; nothing is printed.
      - name: Check bucket secrets
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_DEV_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_DEV_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_DEV_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_DEV_BUCKET }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          $missing = 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_ENDPOINT', 'R2_BUCKET' |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) { throw "The dev feed is enabled in feed.json but these repo secrets are missing (R2_DEV_ACCESS_KEY_ID, R2_DEV_SECRET_ACCESS_KEY, R2_DEV_ENDPOINT, R2_DEV_BUCKET; repo > Settings > Secrets and variables > Actions): $($missing -join ', ')" }
          # Bucket-name sanity check: R2_DEV_BUCKET must be exactly the dev bucket (a swapped secret would publish dev files into the stable bucket).
          # Bucket names are not sensitive, so the expected name is printed; the endpoint never is.
          if ($env:R2_BUCKET -cne 'clink-dev') { throw "R2_DEV_BUCKET must be exactly 'clink-dev' (the dev bucket name); the secret holds something else. Fix the repo secret (docs/RELEASING.md, setup)." }
          # L7. The endpoint must have exactly the shape of an R2 account endpoint (the value is not printed).
          Assert-FeedR2Endpoint -Value $env:R2_ENDPOINT -Name 'R2_DEV_ENDPOINT'

      # Security M1: the highest earlier PUBLISHED (non-draft) release of this repository that carried dev.json is a second downgrade
      # floor, so an emptied or rolled-back bucket cannot lower it (docs/RELEASING.md, "Recovering a stuck feed"). Read-only GET.
      # L-4: only releases made by github-actions[bot] count, and the floor must equal the dev seed the build job embedded
      # (BUILD_SEED): a dev release created, published or deleted while this run was building fails the run here, before anything is signed.
      - name: Find the GitHub history floor
        id: history
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SEED: ${{ needs.build.outputs.min_dev }}
        run: |
          . ./tools/lib/feed-publish-lib.ps1
          $listing = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | [.tag_name, (.draft | tostring), ([.assets[].name] | join(",")), (.author.login | tostring)] | @tsv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the earlier releases.' }
          $floor = Get-FeedHistoryFloor -Channel dev -Listing $listing
          Write-Output "GitHub history floor: $floor (embedded dev seed: '$env:BUILD_SEED')"
          Assert-FeedFloorMatchesSeed -Channel dev -Floor $floor -Seed $env:BUILD_SEED
          Add-Content -Path $env:GITHUB_OUTPUT -Value "floor=$floor"

      # The release notes of a dev build are the fixed dev body (the same text as the release body below and the one the verify steps
      # expect: Get-ExpectedDevReleaseBody; Get-FeedDevNotesText is kept equal by a script test), written as plain UTF-8 to dist/package/notes.txt. That file is NOT a GitHub release asset;
      # the feed upload script publishes it write-once next to the binaries and the manifest's notesUrl points at it.
      - name: Write the release notes (notes.txt)
        shell: pwsh
        run: |
          . ./tools/lib/notes-lib.ps1
          [void](Write-FeedNotesFile -Text (Get-FeedDevNotesText -Commit $env:GITHUB_SHA) -Path dist/package/notes.txt)
          Get-Item dist/package/notes.txt | Select-Object Name, Length

      # The signing key exists only in this step's environment. notesUrl is set by the manifest script itself (<base>dev/<tag>/notes.txt).
      - name: Make and sign the manifest
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        env:
          CLINK_FEED_SIGNING_KEY: ${{ secrets.CLINK_FEED_DEV_SIGNING_KEY }}
          FEED_URL: ${{ steps.feed.outputs.feed_url }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLINK_FEED_SIGNING_KEY)) { throw 'The dev feed is enabled in feed.json but the repo secret CLINK_FEED_DEV_SIGNING_KEY is missing.' }
          $tag = "v$env:VERSION"
          ./tools/make-manifest.ps1 -Channel dev -Version $env:VERSION -Tag $tag -BaseUrl "$($env:FEED_URL)dev/$tag/" `
            -PackageDir dist/package -FeedJson Clink/Assets/feed.json
          Get-ChildItem dist/package | Select-Object Name, Length

      - name: List release assets
        id: assets
        shell: pwsh
        run: |
          $files = @('dist/package/Clink.exe', 'dist/package/Clink.exe.sha256', 'dist/package/Clink-framework.exe', 'dist/package/Clink-framework.exe.sha256', 'dist/package/Clink-Setup.exe', 'dist/package/Clink-Setup.exe.sha256', 'dist/package/THIRD-PARTY-NOTICES.txt')
          if (Test-Path dist/package/dev.json) { $files += 'dist/package/dev.json', 'dist/package/dev.json.sig' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<EOF`n$($files -join "`n")`nEOF"

      # A DRAFT first: nothing is visible until the bucket upload succeeded.
      - name: Create GitHub release (draft)
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Clink v${{ needs.build.outputs.version }} (dev)
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: Dev build of ${{ github.sha }} from the dev branch. Clink installs it only with Dev Build turned on (click the version in the footer).
          files: ${{ steps.assets.outputs.files }}

      # Refuse to publish a release that lacks any of the expected assets. Looked up by the draft's release ID (never by tag); the ID
      # reaches the script only through env. tools/lib/release-verify-lib.ps1 requires: this ID is the ONLY release with the tag vX.Y.Z-dev.N
      # (softprops v3 reuses an existing draft of the same tag, so another release must never be adopted: the "release not yet there"
      # guard above is what keeps it out, this is the second lock), made by github-actions[bot] with the expected name and body, a draft
      # prerelease, every required asset exactly once, uploaded, with the size and SHA-256 digest of the local file (hash-checked against
      # the build job before the upload), nothing else. L2: the draft's target_commitish must be the commit that was built, and (the
      # check is repeated here, before the feed upload) the tag must still not exist: a draft creates none.
      - name: Verify the release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          CLINK_IMMUTABLE_RELEASES: ${{ vars.CLINK_IMMUTABLE_RELEASES }}
        run: |
          . ./tools/lib/release-verify-lib.ps1
          Assert-ReleaseById -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -State draft -Channel dev -Version $env:VERSION -PackageDir dist/package -Commit $env:GITHUB_SHA -ImmutableMode $env:CLINK_IMMUTABLE_RELEASES
          Assert-GitTagMissing -Repository $env:GITHUB_REPOSITORY -Tag "v$env:VERSION"

      - name: Publish to the update feed
        if: steps.feed.outputs.enabled == 'true'
        shell: pwsh
        timeout-minutes: 30
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_DEV_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_DEV_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_DEV_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_DEV_BUCKET }}
          HISTORY_FLOOR: ${{ steps.history.outputs.floor }}
          CLINK_FEED_BUCKET_RESET_VERSION: ${{ vars.CLINK_FEED_BUCKET_RESET_VERSION }}
          CLINK_FEED_KEY_PREFIX: ${{ vars.CLINK_FEED_KEY_PREFIX }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: ./tools/upload-feed.ps1 -Channel dev -Version $env:VERSION -PackageDir dist/package -FeedJson Clink/Assets/feed.json -HistoryFloor $env:HISTORY_FLOOR

      # TOCTOU: the first check ran before the feed upload (minutes ago). Everything is checked AGAIN right before the draft is published:
      # the same release checks, and the tag must still not exist (a tag created in the meantime would make the publish reuse it).
      # A failure DELETES the draft and fails the run (docs/RELEASING.md, "Integrity incident").
      - name: Re-verify the release before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          CLINK_IMMUTABLE_RELEASES: ${{ vars.CLINK_IMMUTABLE_RELEASES }}
        run: |
          . ./tools/lib/release-verify-lib.ps1
          Invoke-ReleaseCheckOrDelete -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -What 'before publishing' -Check {
            Assert-ReleaseById -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -State draft -Channel dev -Version $env:VERSION -PackageDir dist/package -Commit $env:GITHUB_SHA -ImmutableMode $env:CLINK_IMMUTABLE_RELEASES
            Assert-GitTagMissing -Repository $env:GITHUB_REPOSITORY -Tag "v$env:VERSION"
          }

      # Published by ID; a dev build is a prerelease and never becomes "latest".
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          if ($env:RELEASE_ID -cnotmatch '\A[0-9]+\z') { throw 'The draft release ID is missing or not numeric.' }
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false -f make_latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the draft release' }

      # The published release is read back by ID: no longer a draft, IMMUTABLE, the same checks as before (exactly the required assets with
      # their sizes and digests, the expected name and body, built commit, the only release of the tag). A failure DELETES the release
      # (an immutable release keeps its tag) and fails the run loudly.
      - name: Verify the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          CLINK_IMMUTABLE_RELEASES: ${{ vars.CLINK_IMMUTABLE_RELEASES }}
        run: |
          . ./tools/lib/release-verify-lib.ps1
          Invoke-ReleaseCheckOrDelete -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -What 'after publishing' -Check {
            Assert-ReleaseById -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -State published -Channel dev -Version $env:VERSION -PackageDir dist/package -Commit $env:GITHUB_SHA -ImmutableMode $env:CLINK_IMMUTABLE_RELEASES
          }

      # L2: publishing created the tag; it must be a plain (lightweight) tag at the commit that was built. The tag read is retried 3 times,
      # 2 s apart (a new tag can take a moment to show). A failure DELETES the release and fails the run loudly.
      - name: Verify the published tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          . ./tools/lib/release-verify-lib.ps1
          Invoke-ReleaseCheckOrDelete -Repository $env:GITHUB_REPOSITORY -ReleaseId $env:RELEASE_ID -What 'the tag after publishing' -Check {
            Assert-GitTagAtCommit -Repository $env:GITHUB_REPOSITORY -Tag "v$env:VERSION" -Commit $env:GITHUB_SHA -Attempts 3 -DelaySeconds 2
          }

      # Housekeeping: a failure here must not fail a build that was already published. Only after a fully successful run (a failed run
      # must not prune). Keeps the 10 newest PUBLISHED dev PRERELEASES; drafts (left by failed runs) are neither counted nor deleted, and a
      # release that is not flagged as a prerelease is never touched, whatever its tag looks like.
      # The release is deleted first and its tag second: an immutable release keeps its tag (GitHub refuses to remove it), which is
      # reported as a warning and does not stop the rest. A release that cannot be deleted is counted and fails the step at the end
      # (continue-on-error: it shows as a warning annotation only).
      - name: Prune old dev builds
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false     # a failed delete is counted below, not thrown on the spot
          $lines = @(& gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[] | [.tag_name, (.draft | tostring), (.prerelease | tostring)] | @tsv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list the releases' }
          $published = foreach ($line in $lines) {
            $parts = ([string]$line).TrimEnd("`r", "`n").Split("`t")
            if ($parts.Count -eq 3 -and $parts[1] -ceq 'false' -and $parts[2] -ceq 'true' -and $parts[0] -cmatch '\Av[0-9]+\.[0-9]+\.[0-9]+-dev\.([0-9]+)\z') {
              [pscustomobject]@{ Tag = $parts[0]; N = [int64]$Matches[1] }
            }
          }
          $failed = 0
          foreach ($old in @($published | Sort-Object N -Descending | Select-Object -Skip 10)) {
            $t = $old.Tag
            Write-Output "Deleting release $t"
            & gh release delete $t --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Output "::warning::Could not delete release $t"; continue }
            $eap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'          # gh's stderr must not abort the step before we look at it
            $tagOut = (& gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$t" 2>&1 | Out-String)
            $tagCode = $LASTEXITCODE
            $ErrorActionPreference = $eap
            if ($tagCode -ne 0) { Write-Output "::warning::The tag $t was not removed (an immutable release keeps its tag): $($tagOut.Trim())" }
          }
          $global:LASTEXITCODE = 0                       # handled failures above must not fail the step through the runner's exit-code check
          if ($failed -gt 0) { throw "$failed old dev release(s) could not be deleted" }

  # M3 / MF-2. The build artifact (about 150 MB) is deleted as soon as the run is done with it, instead of waiting for retention-days: 1, so the
  # repository's artifact storage does not fill up. A job of its own, so that actions: write (the permission the delete needs) is held by
  # NOTHING else: no checkout, no action, no secret, no tools/ code, one inline step. It runs after the publish job whatever its result (also
  # when publish was skipped or failed), but only when the build job succeeded (otherwise there is no artifact id). It deletes only an
  # artifact that the API reports as named clink-package AND made by THIS run (workflow_run.id = GITHUB_RUN_ID); anything else, or any
  # error, is a warning and never fails the run.
  cleanup:
    needs: [build, publish]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the build artifact
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $id = [string]$env:ARTIFACT_ID
          if ($id -cnotmatch '\A[0-9]+\z' -or [string]$env:GITHUB_RUN_ID -cnotmatch '\A[0-9]+\z') { Write-Output '::warning::No valid build artifact id (or run id); nothing deleted (it expires after 1 day).'; $global:LASTEXITCODE = 0; return }
          $info = (& gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Could not read the build artifact $id; nothing deleted (it expires after 1 day): $($info.Trim())"; $global:LASTEXITCODE = 0; return }
          $artifact = $null
          try { $artifact = $info | ConvertFrom-Json } catch { $artifact = $null }
          if ($null -eq $artifact -or [string]$artifact.name -cne 'clink-package' -or [string]$artifact.workflow_run.id -cne [string]$env:GITHUB_RUN_ID) {
            Write-Output "::warning::Artifact $id is not this run's clink-package; nothing deleted."
            $global:LASTEXITCODE = 0
            return
          }
          $out = (& gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$id" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::Could not delete the build artifact $id (it expires after 1 day): $($out.Trim())" }
          else { Write-Output "Deleted the build artifact $id (clink-package of run $env:GITHUB_RUN_ID)" }
          $global:LASTEXITCODE = 0
