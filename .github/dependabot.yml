# Keeps the commit-pinned actions in .github/workflows current: Dependabot opens a
# PR that moves each pin (and its version comment) to the next release.
# The npm entry keeps the Stream Deck plugin's dependencies (streamdeck/package-lock.json) current.
# The dotnet-sdk entry does the same for the SDK version pinned in global.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /streamdeck
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      elgato:
        patterns:
          - "@elgato/*"
      tooling:
        patterns:
          - "typescript"
          - "esbuild"
          - "@types/node"
    ignore:
      # @elgato/streamdeck is tied to the manifest's SDKVersion 3.
      - dependency-name: "@elgato/streamdeck"
        update-types: ["version-update:semver-major"]
      # The plugin runs on Node 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
